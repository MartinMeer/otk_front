# nginx/default.conf

# Server block to handle incoming HTTP traffic on port 80
server {
    listen 80;
    server_name localhost;

    # Redirect all HTTP traffic to HTTPS with a 301 redirect
    return 301 https://$host$request_uri;
}

# Server block to handle incoming HTTPS traffic on port 443
server {
    listen 443 ssl;
    server_name localhost;

    # Paths to the certificate and key we will copy into the container
    ssl_certificate /etc/nginx/ssl/self-signed.crt;
    ssl_certificate_key /etc/nginx/ssl/self-signed.key;

    # The root directory where our static files are located
    root /usr/share/nginx/html;
    index index.html;

    # Standard location block for serving files
    location / {
        try_files $uri $uri/ /index.html;
    }
}
