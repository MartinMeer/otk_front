# nginx/default.conf - Frontend with API Proxy + Cloudflare SSL

# Server block to handle incoming HTTP traffic on port 80
# Cloudflare handles HTTPS termination, so container only serves HTTP
server {
    listen 80;
    server_name _;

    # The root directory where our static files are located
    root /usr/share/nginx/html;
    index index.html;

    # API Proxy - Forward API requests to backend container
    location /api/ {
        proxy_pass http://backend:8081/;  # 'backend' = backend container name
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        
        # CORS headers for development (backend should handle production CORS)
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
        
        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
            add_header Access-Control-Max-Age 3600;
            add_header Content-Type text/plain;
            add_header Content-Length 0;
            return 204;
        }
    }

    # Health check endpoint (if backend has one)
    location /actuator/ {
        proxy_pass http://backend:8081/actuator/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Frontend SPA routing - must come AFTER API routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers (Cloudflare will add more)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Cache control for static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Version and SW files - no cache
    location ~* \.(json)$|sw\.js$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
